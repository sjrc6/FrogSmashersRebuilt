name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_HOME: ${{ github.workspace }}/.build/dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.build/nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Package Windows and Linux builds
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/publish.sh all

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FrogSmashersRebuilt-windows-${{ github.sha }}
          path: .build/releases/FrogSmashersRebuilt-windows.zip
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload Linux build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FrogSmashersRebuilt-linux-${{ github.sha }}
          path: .build/releases/FrogSmashersRebuilt-linux.tar.gz
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
